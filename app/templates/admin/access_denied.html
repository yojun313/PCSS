<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>접근 제한 - PCSS</title>
    <style>
        /* 기본 스타일 (Light Mode) */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            margin: 20px;
            box-sizing: border-box;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 15px;
            }
        }

        .icon-area {
            font-size: 60px;
            color: rgba(200, 1, 80, 1);
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 24px;
            color: #333;
        }

        p {
            margin: 0 0 30px 0;
            color: #666;
            line-height: 1.5;
            font-size: 15px;
        }

        .email-badge {
            display: inline-block;
            background-color: #f0f0f0;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            color: #555;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            border: none;
            box-sizing: border-box;
        }

        .btn-primary {
            background-color: #34495e;
            color: white;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            background-color: #2c3e50;
        }

        .btn-secondary {
            background-color: transparent;
            color: #666;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background-color: #f5f5f5;
            color: #333;
        }
    </style>
  {% include "partials/pwa_head.html" %}
</head>
<body>

    <div class="container">
        <div class="icon-area">
            &#9888; </div>
        
        <h1>관리자 권한이 없습니다</h1>
        
        <p>
            이 페이지는 관리자만 접근할 수 있습니다.<br>
            현재 로그인된 계정은 관리자 목록에 포함되지 않았습니다.
        </p>

        {% if email %}
        <div class="email-badge">
            {{ email }}
        </div>
        {% endif %}

        <a href="/" class="btn btn-primary">메인으로 돌아가기</a>

        <form action="/logout" method="post" style="width: 100%;">
            <input type="hidden" name="csrftoken" value="{{ request.scope['csrftoken']() }}">
            <input type="hidden" name="next" value="/admin/dashboard">
            <button type="submit" class="btn btn-secondary">로그아웃</button>
        </form>
    </div>
    {% include "partials/footer.html" %}
  </body>
</html>
