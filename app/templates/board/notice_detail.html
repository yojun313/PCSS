<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ notice.title }} - 공지사항</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; padding: 20px; color: #333; box-sizing: border-box; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); box-sizing: border-box; }
        .header { border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; color: #c80150; font-size: 24px; }
        .meta { color: #888; font-size: 13px; margin-top: 10px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px; }
        .content { line-height: 1.6; min-height: 200px; white-space: pre-wrap; }

        .btn-group { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { text-decoration: none; padding: 8px 16px; border-radius: 4px; font-size: 14px; border: none; cursor: pointer; }
        .btn-back { background: #eee; color: #333; border: 1px solid #ddd; }

        /* 관리자 버튼 */
        .btn-edit { background: #34495e; color: #fff; }
        .btn-delete { background: #c80150; color: #fff; }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ notice.title }}</h1>
            <div class="meta">
                <span>작성자: {{ notice.author.split('@')[0] if notice.author else '관리자' }}</span>
                <span>{{ notice.created_at.strftime('%Y-%m-%d %H:%M') }} | 조회 {{ notice.views }}</span>
            </div>
        </div>
        <div class="content">{{ notice.content }}</div>
        
        <div class="btn-group">
            <a href="/board" class="btn btn-back">목록으로</a>

            {% if is_admin %}
                <a href="/board/notice/edit/{{ notice['_id'] }}" class="btn btn-edit">수정</a>
                
                <form action="/board/notice/delete/{{ notice['_id'] }}" method="post" onsubmit="return confirm('이 공지사항을 정말 삭제하시겠습니까?');">
                    <input type="hidden" name="csrftoken" value="{{ request.scope['csrftoken']() }}">
                    <button type="submit" class="btn btn-delete">삭제</button>
                </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
