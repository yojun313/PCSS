<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading...</title>
  <style>
    /* 수정된 body 스타일: 수직 전체 채움, 컬럼 방향 */
    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: rgba(200, 1, 80, 1);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f9f9f9;
      color: #333;
    }
    /* 메인 콘텐츠를 감싸는 래퍼: 중앙 정렬 */
    .main-content-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    /* 좌우 2열 레이아웃 */
    .wrapper {
      display: flex;
      gap: 20px;
      width: 90%;
      max-width: 1200px;
    }
    .left-column {
      flex: 1;
    }
    .right-column {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* 옵션 테이블 스타일 */
    .options-table {
      width: 100%;
      border-collapse: separate; /* 둥근 모서리를 위해 separate */
      border-spacing: 0;
      background-color: #ffffff;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .options-table th, .options-table td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }
    .options-table th {
      background-color: #f2f2f2;
      color: #C80150;
      font-size: 18px;
    }
    .option-label {
      background-color: #fafafa;
      font-weight: bold;
    }
    /* 로딩 영역 스타일 */
    #loading {
      text-align: center;
      margin-bottom: 20px;
    }
    #loading h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #C80150;
    }
    #loading p {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #555;
    }
    .spinner {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #C80150;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Python 출력 영역 */
    #output {
      margin-top: 20px;
      font-size: 1rem;
      line-height: 1.5;
      color: #333;
      white-space: pre-wrap;
      word-wrap: break-word;
      text-align: center;
      width: 100%;
    }
    /* Footer 스타일: 화면 맨 아래쪽에 위치 */
    /* Footer 스타일 */
    .footer {
      text-align: center;
      font-size: 12px;
      margin-top: 20px;
      padding: 10px 0;
      /* 별도의 배경색이나 테두리 없이 깔끔하게 */
    }
    
    /* footer 내부 컨테이너를 세로 정렬 */
    .footer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    
    .footer-container p {
      margin: 0;
      font-weight: bold;
    }
    
    /* 각 사용자 정보를 한 줄에 깔끔하게 정렬 */
    .user {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }
    
    /* 링크 기본 스타일 */
    .user a {
      text-decoration: none;
      transition: color 0.3s;
    }
    
    /* 호버 시 언더라인 */
    .user a:hover {
      text-decoration: underline;
    }
    
    /* (선택사항) Contact: 텍스트를 span으로 감싸면 고정폭을 줄 수도 있음 */
    .contact-label {
      display: inline-block;
      width: 60px;  /* 필요에 따라 조정 */
      text-align: right;
    }
    
    /* 라이트 모드 색상 */
    .footer {
      color: #666;
    }
    
    .user a {
      color: #007bff;
    }
    /* 다크 모드 스타일 */
    @media (prefers-color-scheme: dark) {
      h1 {
        color: #ff88a2;
      }
      body {
        background-color: #121212;
        color: #e0e0e0;
      }
      .options-table {
        background-color: #2c2c2c;
        color: #e0e0e0;
        border: 1px solid #444;
      }
      .options-table th {
        background-color: #3a3a3a;
        color: #ff88a2;
      }
      .option-label {
        background-color: #333;
        color: #e0e0e0;
      }
      .options-table td {
        background-color: #242424;
      }
      #loading h1 {
        color: #ff88a2;
      }
      #loading p {
        color: #aaa;
      }
      .spinner {
        border: 5px solid #333;
        border-top: 5px solid #ff88a2;
      }
      #output {
        color: #e0e0e0;
      }
      .footer {
        color: #aaa;
      }
      .user a {
        color: #4da6ff;
      }
    }
    /* 반응형 디자인 */
    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column;
      }
      #loading h1 {
        font-size: 1.5rem;
      }
      #loading p {
        font-size: 1rem;
      }
      #output {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <h1>PCSS Searching</h1>
  <div class="main-content-wrapper">
    <div class="wrapper">
      <!-- 왼쪽 열: 옵션 데이터 테이블 -->
      <div class="left-column" id="globalData"></div>
      <!-- 오른쪽 열: 로딩 및 Python 출력 영역 -->
      <div class="right-column">
        <div id="loading">
          <h1>Collecting Data...</h1>
          <p>DBLP CRAWLER is working...</p>
          <div class="spinner"></div>
        </div>
        <pre id="output"></pre>
      </div>
    </div>
  </div>
  <footer class="footer">
    <div class="footer-container">
      <p>Created By</p>
      <div class="user">
        <a href="https://github.com/yojun313" target="_blank">Yojun Moon</a>
        <a href="mailto:yojun313@postech.ac.kr">(yojun313@postech.ac.kr)</a> | 
        <a href="https://www.psal.postech.ac.kr/gkim" target="_blank">Gwangsun Kim</a>
        <a href="mailto:g.kim@postech.ac.kr">(g.kim@postech.ac.kr)</a>
      </div>
    </div>
  </footer>
  
  <script src="/socket.io/socket.io.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const output = document.getElementById('output');
      const globalDataDiv = document.getElementById('globalData');
    
      // 1) 옵션 테이블 표시(기존 그대로)
      let inputData = null;
      try {
        const resp = await fetch('/loading-data');
        inputData = await resp.json();
        if (inputData?.error) throw new Error(inputData.error);
        // 기존 테이블 렌더링 로직 유지 (현재 파일 코드 그대로 두면 됨)
      } catch (e) {
        output.textContent = `옵션 로드 실패: ${e.message || e}`;
        return;
      }
    
      // 2) FastAPI 작업 시작
      const FASTAPI_BASE = "http://pcss.r-e.kr:8000"; // 환경에 맞게
      let startRes;
      try {
        startRes = await fetch(`${FASTAPI_BASE}/api/search/start`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(inputData || {})
        });
      } catch (e) {
        output.textContent = `검색 시작 요청 실패(네트워크): ${e.message || e}`;
        return;
      }
    
      if (!startRes.ok) {
        output.textContent = `검색 시작 요청 실패: HTTP ${startRes.status} ${await startRes.text()}`;
        return;
      }
    
      const { job_id, events_url, result_url } = await startRes.json();
      output.textContent = `Job started: ${job_id}\n`;
    
      // 3) SSE 연결
      const es = new EventSource(`${FASTAPI_BASE}${events_url}`);
    
      const append = (line) => {
        output.textContent += line + "\n";
        output.scrollTop = output.scrollHeight;
      };
    
      es.addEventListener("message", (evt) => {
        // FastAPI에서 type=status를 message 이벤트로 보냄
        try {
          const data = JSON.parse(evt.data);
          // data 예: {type:"status", msg:"..."} 형태로 맞추면 좋음
          append(data.msg ?? JSON.stringify(data));
        } catch {
          append(evt.data);
        }
      });
    
      es.addEventListener("event", async (evt) => {
        // started/done/error 등
        let data;
        try { data = JSON.parse(evt.data); } catch { data = { raw: evt.data }; }
    
        if (data?.event === "started") {
          append("[started]");
          return;
        }
    
        if (data?.event === "error") {
          append(`[error] ${data.error || "unknown error"}`);
          es.close();
          // 기존 /results로 에러 렌더링하고 싶으면:
          await renderResultsViaNode({ isDictionary: false, data: data.error || "error" });
          return;
        }
    
        if (data?.event === "done") {
          append("[done] fetching result...");
          es.close();
    
          // 4) 최종 결과 조회
          const r = await fetch(`${FASTAPI_BASE}${result_url}`);
          if (!r.ok) {
            await renderResultsViaNode({ isDictionary: false, data: `결과 조회 실패: HTTP ${r.status}` });
            return;
          }
          const payload = await r.json(); // {status:"done", result:{...}}
          if (payload.status !== "done") {
            await renderResultsViaNode({ isDictionary: false, data: `결과가 아직 준비되지 않음: ${payload.status}` });
            return;
          }
    
          // 5) 기존 Node /results로 넘겨서 results.ejs 렌더링 유지
          await renderResultsViaNode({ isDictionary: true, data: payload.result });
        }
      });
    
      es.addEventListener("ping", () => {
        // 필요하면 heartbeat 표시
        // append("[ping]");
      });
    
      es.onerror = async () => {
        append("[sse error] 연결이 끊어졌습니다.");
        es.close();
        await renderResultsViaNode({ isDictionary: false, data: "SSE 연결 오류" });
      };
    
      async function renderResultsViaNode(body) {
        const resp = await fetch('/results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          append(`POST /results 실패: ${resp.statusText}`);
          return;
        }
        const html = await resp.text();
        document.open();
        document.write(html);
        window.history.pushState({}, '', '/results');
        document.close();
      }
    });
    </script>       
</body>
</html>
