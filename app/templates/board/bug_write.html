<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>버그 제보 - PCSS</title>
    <style>
      /* 기본 스타일은 공지 작성과 동일 */
      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #34495e;
        margin-top: 0;
      }
      label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
      }
      input[type="text"],
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }
      textarea {
        height: 200px;
        resize: vertical;
      }
      .btn-group {
        margin-top: 20px;
        text-align: right;
      }
      button {
        padding: 10px 20px;
        background: #34495e;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background: #2c3e50;
      }
      a.cancel {
        color: #666;
        text-decoration: none;
        margin-right: 15px;
      }

      /* 반응형 디자인 */
      @media (max-width: 768px) {
        body {
          padding: 10px;
        }
        .container {
          padding: 20px;
        }
      }
    </style>
    {% include "partials/pwa_head.html" %}
  </head>
  <body>
    <div class="container">
      <h1>
        {% if mode == 'edit' %}글 수정{% else %}버그 제보 / 건의{% endif %}
      </h1>
      <form method="post">
        <input type="hidden" name="csrftoken" value="{{ request.scope['csrftoken']() }}">
        <label>제목</label>
        <input
          type="text"
          name="title"
          required
          value="{{ bug.title if bug else '' }}"
        />

        <label>내용</label>
        <textarea name="content" required>
{{ bug.content if bug else '' }}</textarea
        >

        <div class="btn-group">
          <a href="/board" class="cancel">취소</a>
          <button type="submit">
            {% if mode == 'edit' %}수정 완료{% else %}등록{% endif %}
          </button>
        </div>
      </form>
    </div>
    {% include "partials/footer.html" %}
  </body>
</html>
