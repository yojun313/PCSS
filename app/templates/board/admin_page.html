<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>{% if mode == 'edit' %}공지사항 수정{% else %}공지사항 작성{% endif %} - PCSS</title>
  {% include "partials/admin_head.html" %}
  <style>
    .notice-form textarea.input { min-height: 420px; line-height: 1.7; }
  </style>
</head>
<body>
  {% include "partials/admin_header.html" %}

  <main class="admin-main">
    <div class="admin-wrap">
      <div class="page-head">
        <div>
          <h1>{% if mode == 'edit' %}공지사항 수정{% else %}공지사항 작성{% endif %}</h1>
          <p class="page-sub">게시판 공지 탭에 올라갑니다.</p>
        </div>
        <div class="page-actions">
          <a class="btn btn-ghost btn-sm" href="/board">게시판으로</a>
        </div>
      </div>

      <section class="card card-pad">
        <form class="notice-form" method="post" action="{{ ('/board/notice/edit/' + notice['_id']|string) if mode == 'edit' else '/board/notice/write' }}">
          <input type="hidden" name="csrftoken" value="{{ request.scope['csrftoken']() }}">
          <div class="field">
            <label for="title">제목</label>
            <input class="input" id="title" type="text" name="title" required placeholder="제목을 입력하세요" value="{{ notice.title if notice else '' }}">
          </div>
          <div class="field">
            <label for="content">내용</label>
            <textarea class="input" id="content" name="content" required placeholder="내용을 입력하세요">{{ notice.content if notice else '' }}</textarea>
          </div>
          <div class="input-row" style="justify-content: flex-end;">
            <a href="/board" class="btn btn-ghost">취소</a>
            <button type="submit" class="btn btn-primary">{% if mode == 'edit' %}수정 완료{% else %}등록{% endif %}</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  {% include "partials/footer.html" %}
</body>
</html>
