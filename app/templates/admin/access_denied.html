<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>접근 제한 - PCSS</title>
  {% include "partials/admin_head.html" %}
  <style>
    .denied-main { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; padding: 60px 16px; }
    .denied-card { width: 100%; max-width: 440px; padding: 36px 28px; text-align: center; }
    .denied-icon {
      width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 50%;
      background: var(--primary-pale); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
    }
    .denied-card h1 { font-size: 21px; margin-bottom: 10px; }
    .denied-card p { margin: 0 0 20px; color: var(--text-muted); line-height: 1.6; }
    .denied-email { display: inline-block; margin-bottom: 22px; padding: 5px 12px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 700; color: var(--heading); word-break: break-all; }
    .denied-card form { margin: 8px 0 0; }
  </style>
</head>
<body>
  <main class="denied-main">
    <div class="card denied-card">
      <div class="denied-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <h1>관리자 권한이 없습니다</h1>
      <p>이 페이지는 관리자만 접근할 수 있습니다.<br>현재 로그인된 계정은 관리자 목록에 없습니다.</p>
      {% if email %}<div class="denied-email">{{ email }}</div>{% endif %}
      <a href="/" class="btn btn-secondary btn-block">메인으로 돌아가기</a>
      <form action="/auth/logout?next=/auth/login%3Fnext%3D/admin/dashboard" method="post">
        <input type="hidden" name="csrftoken" value="{{ request.scope['csrftoken']() }}">
        <button type="submit" class="btn btn-ghost btn-block">다른 계정으로 로그인</button>
      </form>
    </div>
  </main>
  {% include "partials/footer.html" %}
</body>
</html>
