<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>PCSS 저자 실적 검색</title>
    <style>
        /* --- Base Styles (from Board Design) --- */
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; color: #333; margin:0; padding:0; }
        
        /* 컨테이너: 게시판과 동일한 카드 스타일 */
        .container { 
            max-width: 800px; /* 검색창이므로 게시판(1100px)보다는 약간 좁게 설정 */
            margin: 60px auto; 
            padding: 40px; 
            background: #fff; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        h1 { color: #c80150; text-align: center; margin-bottom: 40px; }
        
        /* --- Search Form Styles --- */
        .search-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            position: relative; /* Anchor for autocomplete */
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-label {
            font-weight: bold;
            color: #34495e;
            font-size: 16px;
        }

        /* 입력창 스타일 */
        .form-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #c80150;
            box-shadow: 0 0 0 3px rgba(200, 1, 80, 0.1);
        }

        /* 검색 버튼 스타일 (게시판의 '글쓰기' 버튼 스타일 응용) */
        .btn-search {
            width: 100%;
            padding: 14px;
            background-color: #c80150;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-search:hover {
            background-color: #a00140;
        }

        /* --- Autocomplete List Style (Fixed) --- */
        .autocomplete-items {
            position: absolute;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 250px;
            overflow-y: auto;
        }

        .autocomplete-items div {
            padding: 12px;
            cursor: pointer;
            background-color: #fff;
            border-bottom: 1px solid #eee;
            border-left: 1px solid #eee;
            border-right: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        .autocomplete-items div:last-child {
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        .autocomplete-items div:hover {
            background-color: #f1f1f1;
        }

        .autocomplete-active {
            background-color: #34495e !important; /* 게시판 버튼색 활용 */
            color: #ffffff;
        }

        .pid-hint {
            font-size: 12px;
            color: #888;
        }
        
        /* --- Helper Text & Footer --- */
        .helper-text {
            font-size: 13px;
            color: #777;
            line-height: 1.6;
            margin-top: 10px;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .footer-credits {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 30px;
        }
        .footer-credits a { color: #777; text-decoration: none; }
        .footer-credits a:hover { text-decoration: underline; color: #c80150; }

        .home-link { 
            display: block; 
            text-align: center; 
            margin-top: 20px; 
            color: #666; 
            text-decoration: none;
            font-size: 14px;
        }
        .home-link:hover { color: #c80150; text-decoration: underline; }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                margin: 20px auto;
                padding: 20px;
                box-sizing: border-box;
            }
            h1 {
                margin-bottom: 24px;
                font-size: 1.5rem;
            }
            .search-wrapper {
                max-width: 100%;
            }
        }
    </style>
  {% include "partials/pwa_head.html" %}
</head>
<body>

    <div class="container">
        <div>
            <h1>PCSS 저자 실적 검색</h1>

            <div class="search-wrapper">
                <form id="author-search-form" action="/author/stats/page" method="POST" autocomplete="off">
                    <input type="hidden" name="csrftoken" value="{{ request.scope['csrftoken']() }}">
                
                    <div class="form-group">
                        <label for="author-input" class="form-label">저자 이름</label>
                        <div style="position: relative;">
                          <input 
                              type="text" 
                              id="author-input" 
                              name="target_author" 
                              class="form-input" 
                              placeholder="이름 또는 PID를 입력하세요 (예: Gildong Hong, 12/34567)" 
                              required
                          >
                            <div id="autocomplete-list" class="autocomplete-items"></div>
                        </div>
                        
                        <input type="hidden" id="pid-input" name="target_pid">
                        <input type="hidden" name="url" value=""> 
                        <input type="hidden" name="probability" value="0.8"> 
                    </div>

                    <button type="submit" id="submit-btn" class="btn-search">실적 통계 확인</button>
                </form>

                <div class="helper-text">
                    * <strong>자동완성 목록</strong>에서 저자를 선택해야 정확한 검색이 가능합니다.<br>
                    * 목록에 없는 경우, DB에 해당 저자 정보가 아직 수집되지 않았을 수 있습니다.
                </div>
            </div>
        </div>

        <div>
            <a href="/" class="home-link">← 메인 페이지로 돌아가기</a>
        </div>
    </div>

    <script>
      const form = document.getElementById("author-search-form");
      const inp = document.getElementById("author-input");
      const pidInp = document.getElementById("pid-input");
      const listContainer = document.getElementById("autocomplete-list");
      
      let currentFocus = -1;
      let debounceTimer;

      // 1. INPUT EVENT
      inp.addEventListener("input", function(e) {
          const val = this.value;
          
          // PID 초기화 (사용자가 타이핑을 시작하면 기존 선택 무효화)
          pidInp.value = ""; 
          
          closeAllLists();
          if (!val) return false;
          
          currentFocus = -1;
          
          // Debounce 적용 (300ms)
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
              fetchSuggestions(val);
          }, 300);
      });

      // 2. FORM SUBMIT EVENT
      form.addEventListener("submit", function(e) {
          e.preventDefault();
          if (!pidInp.value) {
              alert("정확한 검색을 위해 자동완성 목록에서 저자를 선택해주세요.");
              inp.focus();
              return;
          }
          // 공유 · 북마크할 수 있는 저자 페이지 주소로 이동 (pid 의 '/' 는 그대로 둔다)
          const pidPath = pidInp.value.split("/").map(encodeURIComponent).join("/");
          window.location.href = `/author/p/${pidPath}`;
      });

      async function fetchSuggestions(query) {
          try {
              const res = await fetch(`/author/autocomplete?query=${encodeURIComponent(query)}`);
              if (!res.ok) throw new Error("Network response was not ok");
              const data = await res.json();
              renderSuggestions(data);
          } catch (err) {
              console.error("Autocomplete fetch error:", err);
          }
      }

      function renderSuggestions(arr) {
          if (!arr || arr.length === 0) return;

          currentFocus = -1;
          
          // 기존 목록 초기화 (DOM 삭제가 아닌 내용 비우기)
          listContainer.innerHTML = ""; 

          arr.forEach(item => {
              const div = document.createElement("div");
              
              // 화면 표시 내용
              // 소속이 있으면 동명이인 구분용으로 PID 대신 보여 준다
              const nameEl = document.createElement("span");
              nameEl.textContent = item.name;
              const hintEl = document.createElement("span");
              hintEl.className = "pid-hint";
              hintEl.textContent = item.affiliation ? ` (${item.affiliation})` : ` (PID: ${item.pid})`;
              div.append(nameEl, hintEl);
              
              // 클릭 이벤트
              div.addEventListener("click", function(e) {
                  inp.value = item.name;
                  pidInp.value = item.pid; // PID 주입
                  
                  closeAllLists();
              });
              
              listContainer.appendChild(div);
          });
      }

      // 3. KEYBOARD NAVIGATION
      inp.addEventListener("keydown", function(e) {
          let x = listContainer.getElementsByTagName("div");
          if (e.keyCode == 40) { // Down
              currentFocus++;
              addActive(x);
          } else if (e.keyCode == 38) { // Up
              currentFocus--;
              addActive(x);
          } else if (e.keyCode == 13) { // Enter
              e.preventDefault(); 
              if (currentFocus > -1) {
                  if (x) x[currentFocus].click();
              } else if (x && x.length === 1) {
                  x[0].click();
              }
          }
      });

      function addActive(x) {
          if (!x) return false;
          removeActive(x);
          if (currentFocus >= x.length) currentFocus = 0;
          if (currentFocus < 0) currentFocus = (x.length - 1);
          x[currentFocus].classList.add("autocomplete-active");
          x[currentFocus].scrollIntoView({block: "nearest"});
      }

      function removeActive(x) {
          for (let i = 0; i < x.length; i++) {
              x[i].classList.remove("autocomplete-active");
          }
      }

      // [중요] 수정된 리스트 닫기 함수: 요소를 삭제하지 않고 내용만 비움
      function closeAllLists(elmnt) {
          if (elmnt != inp) {
              listContainer.innerHTML = "";
          }
      }

      // 외부 클릭 시 닫기
      document.addEventListener("click", function (e) {
          closeAllLists(e.target);
      });
    </script>
    {% include "partials/footer.html" %}
  </body>
</html>
