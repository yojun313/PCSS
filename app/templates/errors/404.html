<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - PCSS</title>
    <style>
        /* [기본: 라이트 모드] */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            color: #333;
            background-color: #ffffff; /* 배경색 명시 */
            margin: 0;
            box-sizing: border-box;
        }
        h1 { 
            font-size: 50px; 
            color: #c80150; 
            margin-bottom: 20px; 
        }
        p { 
            font-size: 18px; 
            color: #666; 
            margin-bottom: 30px; 
            line-height: 1.5;
        }
        /* 에러 상세 메시지 (기존 인라인 스타일 대체) */
        .error-detail {
            font-size: 14px;
            color: #999;
        }
        a { 
            text-decoration: none; 
            background-color: #34495e; 
            color: white; 
            padding: 10px 20px; 
            border-radius: 5px; 
            display: inline-block;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #2c3e50;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            body {
                padding: 30px 20px;
            }
            h1 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <h1>404 Not Found</h1>
    <p>
        요청하신 페이지나 작업을 찾을 수 없습니다.<br>
        <span style="font-size: 14px; color: #999;">({{ error_message }})</span>
    </p>
    <a href="/">메인으로 돌아가기</a>
    {% include "partials/footer.html" %}
  </body>
</html>
