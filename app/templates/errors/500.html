<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Server Error - PCSS</title>
    <style>
        /* [기본: 라이트 모드] */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            color: #333;
            background-color: #ffffff;
            margin: 0;
            box-sizing: border-box;
        }
        h1 { 
            font-size: 50px; 
            color: #c80150; 
            margin-bottom: 20px; 
        }
        p { 
            font-size: 18px; 
            color: #666; 
            margin-bottom: 30px; 
            line-height: 1.5;
        }
        .error-detail {
            font-size: 14px;
            color: #999;
        }
        a { 
            text-decoration: none; 
            background-color: #34495e; 
            color: white; 
            padding: 10px 20px; 
            border-radius: 5px; 
            display: inline-block;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #2c3e50;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            body {
                padding: 30px 20px;
            }
            h1 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <h1>500 Error</h1>
    <p>
        죄송합니다. 서버 내부에 문제가 발생했습니다.<br>
        잠시 후 다시 시도해 주세요.<br>
        <br>
        <span class="error-detail">({{ error_message }})</span>
    </p>
    <a href="/">메인으로 돌아가기</a>
</body>
</html>
